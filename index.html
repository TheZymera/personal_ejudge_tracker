<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0f19" />
  <title>Algocode B — Статистика</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --card-border: #232f46;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --purple: #c084fc;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 14px 36px;
      max-width: 540px;
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .user-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .sub-status {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:active { transform: scale(0.96); }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .hero-card {
      background: linear-gradient(160deg, #192338 0%, #111827 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 8px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .hero-value {
      font-size: 3.1rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1.5px;
      margin-bottom: 6px;
    }

    .hero-value.rank { color: var(--accent); }
    .hero-value.group-rank { color: var(--purple); }
    .hero-value.solved { color: var(--green); }

    .hero-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .hero-meta {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 5px;
    }

    .section-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    .contest-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contest-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 15px;
    }

    .contest-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .contest-name {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .contest-id-tag {
      font-size: 0.73rem;
      color: var(--muted);
      font-weight: 500;
      margin-top: 2px;
    }

    .contest-badge {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .contest-badge.done {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background: #0b0f19;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .next-box {
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .next-primary {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--amber);
      line-height: 1.35;
    }

    .next-secondary {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.3;
    }

    .all-done {
      font-size: 0.88rem;
      color: var(--green);
      font-weight: 700;
    }

    .prob-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .pill {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 6px;
      background: #0b0f19;
      color: var(--muted);
      border: 1px solid var(--card-border);
    }

    .pill.ac {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border-color: rgba(34, 197, 94, 0.4);
    }

    .pill.wa {
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }

    .pill.next-target {
      border-color: var(--amber);
      color: var(--amber);
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.25);
    }

    .contest-link {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .contest-link:active { opacity: 0.75; }

    .debug-box {
      margin-top: 16px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      font-size: 0.78rem;
      line-height: 1.35;
      word-break: break-word;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="user-title">Конников Вячеслав</div>
      <div class="sub-status" id="statusText">Загрузка таблицы...</div>
    </div>
    <button class="btn" onclick="loadStandings()">↻ Обновить</button>
  </div>

  <div class="hero-grid">
    <div class="hero-card">
      <div class="hero-value rank" id="rankVal">—</div>
      <div class="hero-label">Общее место</div>
      <div class="hero-meta" id="totalUsersMeta">Из — чел.</div>
    </div>

    <div class="hero-card">
      <div class="hero-value group-rank" id="groupRankVal">—</div>
      <div class="hero-label" id="groupLabel">Место в группе</div>
      <div class="hero-meta" id="groupUsersMeta">Из — чел.</div>
    </div>

    <div class="hero-card">
      <div class="hero-value solved" id="solvedVal">—</div>
      <div class="hero-label">Решено</div>
      <div class="hero-meta" id="penaltyMeta">Штраф: —</div>
    </div>
  </div>

  <div class="section-title" id="contestsHeader">Контесты</div>
  <div class="contest-list" id="contestList"></div>

  <div class="debug-box" id="debugBox"></div>

  <script>
    const TARGET_NAME = "Конников Вячеслав";
    const STANDINGS_JSON_URL = "https://algocode.ru/standings_data/b_fall_2026";
    const BASE_CONTEST_ID = 83001;
    const STORAGE_KEY = "algocode_b_fall_2026_json_v1";
    const REQUEST_TIMEOUT_MS = 15000;
  
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzCirmTGsQQBQXv69gzcHG9nfoubVgkgnpPCzAYIWGJi84IlYO77Sih-9GntgsgbtcU/exec";
  
    const statusEl = document.getElementById("statusText");
    const debugBox = document.getElementById("debugBox");
  
    function setStatus(text) {
      statusEl.textContent = text;
    }
  
    function showDebug(title, details) {
      debugBox.style.display = "block";
      debugBox.innerHTML = `<b>${title}</b><br>${details}`;
    }
  
    function hideDebug() {
      debugBox.style.display = "none";
      debugBox.innerHTML = "";
    }
  
    async function fetchJson() {
      const proxyUrl =
        APPS_SCRIPT_URL +
        "?url=" +
        encodeURIComponent(STANDINGS_JSON_URL);
  
      setStatus("Загружаю данные через Apps Script...");
  
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  
      try {
        const response = await fetch(proxyUrl, {
          signal: controller.signal,
          cache: "no-store"
        });
  
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
  
        const text = await response.text();
  
        try {
          return JSON.parse(text);
        } catch (error) {
          throw new Error(
            "Apps Script вернул не JSON. Начало ответа: " +
            text.slice(0, 200)
          );
        }
      } finally {
        clearTimeout(timer);
      }
    }
  
    function parseStandingsJson(data) {
      if (!data || !Array.isArray(data.users) || !Array.isArray(data.contests)) {
        throw new Error("В JSON нет массивов users или contests");
      }
  
      const users = data.users;
      const contests = data.contests;
  
      if (!users.length || !contests.length) {
        throw new Error("JSON пустой: нет пользователей или контестов");
      }
  
      // Считаем балл, штраф и статистику по каждой задаче.
      const problemStats = contests.map((contest) => {
        return contest.problems.map(() => ({
          solvedCount: 0
        }));
      });
  
      users.forEach((user) => {
        let totalScore = 0;
        let totalPenalty = 0;
  
        contests.forEach((contest, contestIndex) => {
          const results = contest.users[user.id] || [];
  
          contest.problems.forEach((problem, problemIndex) => {
            const result = results[problemIndex];
  
            if (!result) {
              return;
            }
  
            const score = Number(result.score) || 0;
            const penalty = Number(result.penalty) || 0;
  
            totalScore += score;
  
            if (score !== 0) {
              totalPenalty += penalty;
            }
  
            if (score > 0) {
              problemStats[contestIndex][problemIndex].solvedCount++;
            }
          });
        });
  
        user.totalScore = totalScore;
        user.totalPenalty = totalPenalty;
      });
  
      // Общий рейтинг: больше баллов — выше; при равенстве меньше штраф — выше.
      const sortedUsers = [...users].sort((a, b) => {
        if (b.totalScore !== a.totalScore) {
          return b.totalScore - a.totalScore;
        }
  
        if (a.totalPenalty !== b.totalPenalty) {
          return a.totalPenalty - b.totalPenalty;
        }
  
        return String(a.name).localeCompare(String(b.name));
      });
  
      sortedUsers.forEach((user, index) => {
        user.overallRank = index + 1;
      });
  
      // Рейтинг внутри каждой группы.
      const groups = {};
  
      sortedUsers.forEach((user) => {
        const group = user.group_short || "?";
  
        if (!groups[group]) {
          groups[group] = [];
        }
  
        groups[group].push(user);
      });
  
      Object.values(groups).forEach((groupUsers) => {
        groupUsers.forEach((user, index) => {
          user.groupRank = index + 1;
        });
  
        groupUsers.forEach((user) => {
          user.groupTotal = groupUsers.length;
        });
      });
  
      // Ищем тебя.
      const me = users.find((user) =>
        String(user.name || "")
          .toLowerCase()
          .includes(TARGET_NAME.toLowerCase())
      );
  
      if (!me) {
        throw new Error(`Участник «${TARGET_NAME}» не найден в JSON`);
      }
  
      // Собираем контесты для интерфейса.
      const parsedContests = contests.map((contest, contestIndex) => {
        const myResults = contest.users[me.id] || [];
        const contestId =
          BASE_CONTEST_ID + (contests.length - 1 - contestIndex);
  
        const problems = contest.problems.map((problem, problemIndex) => {
          const result = myResults[problemIndex] || {};
          const score = Number(result.score) || 0;
          const penalty = Number(result.penalty) || 0;
  
          return {
            label: problem.short || String.fromCharCode(65 + problemIndex),
            title: problem.long || "",
            solvedByMe: score > 0,
            attemptedByMe:
              score === 0 &&
              (
                penalty > 0 ||
                result.verdict === "RJ" ||
                result.verdict === "IG" ||
                result.verdict === "PR" ||
                result.verdict === "AC" ||
                result.verdict === "SM" ||
                result.verdict === "SV" ||
                result.verdict === "DQ"
              ),
            totalSolves: problemStats[contestIndex][problemIndex].solvedCount
          };
        });
  
        return {
          title: contest.title || `Контест ${contestIndex + 1}`,
          contestId,
          problems
        };
      });
  
      return {
        myStats: {
          rank: me.overallRank,
          group: me.group_short || "?",
          groupRank: me.groupRank,
          groupTotal: me.groupTotal,
          solved: me.totalScore,
          penalty: me.totalPenalty
        },
        totalParticipants: users.length,
        contests: parsedContests,
        updatedAt: Date.now()
      };
    }
  
    function renderDashboard(data) {
      if (data.myStats) {
        document.getElementById("rankVal").textContent = data.myStats.rank;
        document.getElementById("totalUsersMeta").textContent =
          `Из ${data.totalParticipants} чел.`;
  
        document.getElementById("groupRankVal").textContent =
          data.myStats.groupRank || "—";
  
        document.getElementById("groupLabel").textContent =
          `Место в гр. ${data.myStats.group}`;
  
        document.getElementById("groupUsersMeta").textContent =
          data.myStats.groupTotal
            ? `Из ${data.myStats.groupTotal} чел.`
            : "Из — чел.";
  
        document.getElementById("solvedVal").textContent = data.myStats.solved;
        document.getElementById("penaltyMeta").textContent =
          `Штраф: ${data.myStats.penalty}`;
      }
  
      const contests = data.contests || [];
      document.getElementById("contestsHeader").textContent =
        `Контесты (${contests.length})`;
  
      const container = document.getElementById("contestList");
      container.innerHTML = "";
  
      contests.forEach((contest) => {
        const totalProblems = contest.problems.length;
        const solvedProblems = contest.problems.filter(
          (problem) => problem.solvedByMe
        ).length;
  
        const percent = totalProblems
          ? Math.round((solvedProblems / totalProblems) * 100)
          : 0;
  
        const unsolved = contest.problems
          .filter((problem) => !problem.solvedByMe)
          .sort((a, b) => b.totalSolves - a.totalSolves);
  
        const firstNext = unsolved[0] || null;
        const secondNext = unsolved[1] || null;
  
        const formatProblem = (problem) =>
          problem.title
            ? `Задача ${problem.label} «${problem.title}»`
            : `Задача ${problem.label}`;
  
        let recommendation = "";
  
        if (!firstNext) {
          recommendation = `
            <div class="next-box">
              <div class="all-done">✓ Все задачи контеста решены!</div>
            </div>
          `;
        } else {
          recommendation = `
            <div class="next-box">
              <div class="next-primary">
                🎯 Следующая: ${formatProblem(firstNext)} — решили ${firstNext.totalSolves} чел.
              </div>
              <div class="next-secondary">
                ${
                  secondNext
                    ? `После неё: ${formatProblem(secondNext)} (решили ${secondNext.totalSolves} чел.)`
                    : "Это последняя нерешённая задача в контесте!"
                }
              </div>
            </div>
          `;
        }
  
        const pills = contest.problems
          .map((problem) => {
            const isTarget =
              firstNext &&
              problem.label === firstNext.label &&
              !problem.solvedByMe;
  
            let className = "pill";
  
            if (problem.solvedByMe) {
              className += " ac";
            } else if (problem.attemptedByMe) {
              className += " wa";
            }
  
            if (isTarget) {
              className += " next-target";
            }
  
            const tooltip = problem.title
              ? `${problem.label}: ${problem.title}`
              : problem.label;
  
            return `
              <span class="${className}" title="${tooltip}">
                ${problem.label} (${problem.totalSolves})
              </span>
            `;
          })
          .join("");
  
        const ejudgeUrl =
          `https://ejudge.old.algocode.ru/cgi-bin/new-client?contest_id=${contest.contestId}`;
  
        const card = document.createElement("div");
        card.className = "contest-card";
        card.innerHTML = `
          <div class="contest-top">
            <div>
              <div class="contest-name">${contest.title}</div>
              <div class="contest-id-tag">Contest ID: ${contest.contestId}</div>
            </div>
  
            <div class="contest-badge ${
              totalProblems && solvedProblems === totalProblems ? "done" : ""
            }">
              ${solvedProblems} из ${totalProblems}
            </div>
          </div>
  
          <div class="progress-track">
            <div class="progress-fill" style="width: ${percent}%"></div>
          </div>
  
          ${recommendation}
  
          <div class="prob-pills">${pills}</div>
  
          <a class="contest-link" href="${ejudgeUrl}" target="_blank" rel="noopener">
            Открыть контест #${contest.contestId} в ejudge →
          </a>
        `;
  
        container.appendChild(card);
      });
    }
  
    async function loadStandings() {
      hideDebug();
      setStatus("Обновление статистики...");
  
      try {
        const json = await fetchJson();
  
        setStatus("Разбираю JSON...");
        const data = parseStandingsJson(json);
  
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        renderDashboard(data);
  
        const time = new Date().toLocaleTimeString("ru-RU", {
          hour: "2-digit",
          minute: "2-digit"
        });
  
        setStatus(`Актуально на ${time}`);
      } catch (error) {
        console.error("Ошибка:", error);
        setStatus("Не удалось обновить данные");
        showDebug("Ошибка", error.message);
      }
    }
  
    const cachedRaw = localStorage.getItem(STORAGE_KEY);
  
    if (cachedRaw) {
      try {
        renderDashboard(JSON.parse(cachedRaw));
      } catch (error) {
        console.warn("Не удалось показать кэш:", error);
      }
    }
  
    loadStandings();
  </script>
</body>
</html>
